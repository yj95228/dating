name: Supabase 운영 배포
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:
    inputs:
      deploy_database:
        description: 'DB 마이그레이션도 함께 적용할까요? 이력 복구 후에만 선택'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  deploy:
    # No GitHub secrets are required merely to merge or inspect this workflow.
    # Enable only after supplying the token in repository Actions Secrets.
    if: ${{ vars.SUPABASE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: jidxdpznkbfhhxlnzhsq
      DB_AUTO_ENABLED: ${{ vars.SUPABASE_DB_DEPLOY_ENABLED }}
      MANUAL_DB: ${{ inputs.deploy_database }}
      BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: DB 변경 여부 확인
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          database_changed=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$MANUAL_DB" == "true" ]]; then database_changed=true; fi
          else
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              echo "::error::변경 범위를 확인할 수 없어 배포를 중단합니다."
              exit 1
            fi
            if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- supabase/migrations/ | grep -q .; then
              database_changed=true
            fi
          fi
          echo "database_changed=$database_changed" >> "$GITHUB_OUTPUT"

      - name: 필수 자격정보와 DB 자동 배포 잠금 확인
        env:
          DATABASE_CHANGED: ${{ steps.changes.outputs.database_changed }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::GitHub Actions Secret SUPABASE_ACCESS_TOKEN이 필요합니다."
            exit 1
          fi
          if [[ "$DATABASE_CHANGED" == "true" ]]; then
            if [[ "$DB_AUTO_ENABLED" != "true" ]]; then
              echo "::error::DB 마이그레이션 변경이 있지만 자동 배포가 잠겨 있습니다. 먼저 원격 마이그레이션 이력을 정리하고 SUPABASE_DB_DEPLOY_ENABLED=true로 설정해야 합니다."
              exit 1
            fi
            if [[ -z "$SUPABASE_DB_PASSWORD" ]]; then
              echo "::error::GitHub Actions Secret SUPABASE_DB_PASSWORD가 필요합니다."
              exit 1
            fi
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 원격 DB 연결
        if: steps.changes.outputs.database_changed == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: 기존 마이그레이션 이력 충돌 점검
        if: steps.changes.outputs.database_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          NO_COLOR=1 supabase migration list --remote > /tmp/supabase-migration-list.txt
          node scripts/check-supabase-migration-history.mjs /tmp/supabase-migration-list.txt

      - name: DB 마이그레이션 배포
        if: steps.changes.outputs.database_changed == 'true'
        run: supabase db push --remote --yes

      - name: Edge Functions 배포
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
