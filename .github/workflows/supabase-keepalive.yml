# Calls a public, read-only RPC; never uses a service_role or secret key.
# UTC 00:17, 06:17, 12:17 = Korea 09:17, 15:17, 21:17.
name: Supabase DB 정기 점검
on:
  schedule:
    - cron: '17 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 데이터베이스 응답 점검
        shell: bash
        env:
          SUPABASE_URL: https://jidxdpznkbfhhxlnzhsq.supabase.co
          # Publishable keys are public client credentials; RLS still applies.
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_3sFwqduEBpfo2bwjs7rkrA_PvghZy0f
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if response="$(curl --silent --show-error --fail-with-body \
              --connect-timeout 10 --max-time 30 \
              --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              --header "Content-Type: application/json" \
              --request POST --data '{}' \
              "${SUPABASE_URL}/rest/v1/rpc/keepalive_ping")"; then
              if [[ "${response}" == "true" ]]; then
                echo "Supabase DB 점검 성공"
                exit 0
              fi
              echo "예상하지 못한 응답 (시도 ${attempt}/3)"
            else
              echo "Supabase DB 요청 실패 (시도 ${attempt}/3)" >&2
            fi
            sleep 5
          done
          echo "Supabase DB 점검이 3회 실패했습니다." >&2
          exit 1
